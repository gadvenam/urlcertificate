kind: ConfigMap
apiVersion: v1
metadata:
  name: ldap-group-syncer
  namespace: ldap-sync
data:
  sync.yaml: |
    kind: LDAPSyncConfig
    apiVersion: v1
    url: ldaps://corp.ad.sbi/ou=GTCMP Users,ou=GTCMP,ou=GITC Belapur,dc=corp,dc=ad,dc=sbi?sAMAccountName
    insecure: false
    bindDN: "cn=cmpicpdevadmin,ou=GTCMP Users,ou=GTCMP,ou=GITC Belapur,dc=corp,dc=ad,dc=sbi"
    bindPassword: "Cmp0cp@100325"
    ca: /etc/ldap-ca/ca.crt
    rfc2307:
      groupsQuery:
        baseDN: "DC=CORP,DC=AD,DC=SBI"
        scope: sub
        filter: (|(cn=EPAY_OCP_BANK)(cn=EPAY_OCP_DEVOPS)(cn=EPAY_OCP_PROD_SUPPORT)(cn=EPAY_OCP_MERC_SUPPORT)(cn=EPAY_OCP_DEVELOPER))
        derefAliases: never
        pageSize: 0
      groupUIDAttribute: dn
      groupNameAttributes: [ cn ]
      groupMembershipAttributes: [ member ]
      usersQuery:
        baseDN: "DC=CORP,DC=AD,DC=SBI"
        scope: sub
        derefAliases: never
        pageSize: 0
      userUIDAttribute: dn
      userNameAttributes: [ sAMAccountName ]
      tolerateMemberNotFoundErrors: false
      tolerateMemberOutOfScopeErrors: false
